name: Bepar VPN Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Bepar VPN
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project Directory
        run: |
          if [ -f "gradlew" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "Bepar-VPN-Android/gradlew" ]; then
            echo "PROJECT_DIR=Bepar-VPN-Android" >> $GITHUB_ENV
          else
            echo "ERROR: gradlew not found!"
            find . -name gradlew
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          java -version

      - name: Check Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace \
          :app:dependencies \
          --configuration debugRuntimeClasspath

      - name: Build Bepar VPN APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bepar-VPN-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
